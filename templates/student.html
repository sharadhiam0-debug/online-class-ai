<!DOCTYPE html>
<html>
<head>
  <title>Student Class</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body class="student-bg">

<div class="theme-toggle" onclick="toggleTheme()">
    <span id="themeLabel">🌙 Dark</span>
    <div class="toggle-track"><div class="toggle-thumb"></div></div>
</div>

<h1>🧑‍🎓 Student Class</h1>

<div class="controls">
  <button id="camBtn" class="btn green"  onclick="toggleCamera()">📷 Camera ON</button>
  <button id="micBtn" class="btn green"  onclick="toggleMic()">🎙 Mic ON</button>
</div>

<div class="main-layout">

  <div class="video-grid">
    <div class="video-box">
      <h3>Your Video</h3>
      <video id="localVideo" autoplay muted></video>
    </div>
    <div class="video-box">
      <h3>Teacher Video</h3>
      <video id="remoteVideo" autoplay></video>
    </div>
  </div>

  <div class="chat-panel">
    <div class="chat-header">✦ Class Chat</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Write a message…" onkeydown="chatEnter(event)" />
      <button onclick="sendChat()">➤</button>
    </div>
  </div>

</div>

<script>
function toggleTheme(){
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    document.getElementById('themeLabel').textContent = isDark ? '☀️ Light' : '🌙 Dark';
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
if(localStorage.getItem('theme') === 'dark'){
    document.body.classList.add('dark');
    document.getElementById('themeLabel').textContent = '☀️ Light';
}

const socket = io();
const ROLE = "Student";
let localStream;
let pc = new RTCPeerConnection();
let canvas = document.createElement("canvas");

navigator.mediaDevices.getUserMedia({ video: true, audio: true })
.then(stream => {
  localStream = stream;
  localVideo.srcObject = stream;
  stream.getTracks().forEach(track => pc.addTrack(track, stream));
});

pc.ontrack = e => remoteVideo.srcObject = e.streams[0];
pc.onicecandidate = e => e.candidate && socket.emit("ice-candidate", e.candidate);

socket.on("offer", async offer => {
  await pc.setRemoteDescription(offer);
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  socket.emit("answer", answer);
});

socket.on("ice-candidate", c => pc.addIceCandidate(c));

function toggleCamera(){
  const t = localStream.getVideoTracks()[0];
  t.enabled = !t.enabled;
  camBtn.className = t.enabled ? "btn green" : "btn red";
  camBtn.innerText  = t.enabled ? "📷 Camera ON" : "📷 Camera OFF";
}

function toggleMic(){
  const t = localStream.getAudioTracks()[0];
  t.enabled = !t.enabled;
  micBtn.className = t.enabled ? "btn green" : "btn red";
  micBtn.innerText  = t.enabled ? "🎙 Mic ON" : "🎙 Mic OFF";
}

setInterval(() => {
  if (!localStream) return;
  const track = localStream.getVideoTracks()[0];
  if (!track || !track.enabled) return;
  canvas.width  = localVideo.videoWidth;
  canvas.height = localVideo.videoHeight;
  canvas.getContext("2d").drawImage(localVideo, 0, 0, canvas.width, canvas.height);
  socket.emit("send_frame", canvas.toDataURL("image/jpeg", 0.7));
}, 1000);

function sendChat(){
  const input = document.getElementById("chatInput");
  const msg = input.value.trim();
  if (!msg) return;
  socket.emit("chat_message", { sender: ROLE, text: msg });
  input.value = "";
}

function chatEnter(e){ if (e.key === "Enter") sendChat(); }

socket.on("chat_message", data => {
  const box  = document.getElementById("chatMessages");
  const isMe = data.sender === ROLE;
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble " + (isMe ? "me" : "other");
  bubble.innerHTML = `<div class="msg-sender">${data.sender}</div>${escHtml(data.text)}`;
  box.appendChild(bubble);
  box.scrollTop = box.scrollHeight;
});

function escHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
